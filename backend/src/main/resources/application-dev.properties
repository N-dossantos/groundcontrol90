# ========================================
# CONFIGURACIÓN PARA DESARROLLO (H2)
# ========================================

# Configuración del servidor
server.port=8081

# Logging detallado: acá sí es útil ver las queries y la cadena de autenticación.
# El archivo base (application.properties) deja todo en INFO porque aplica a prod.
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=DEBUG

# H2 Database (base de datos en memoria para desarrollo)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Habilitar consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway solo se usa en prod (las migraciones son DDL de MySQL, acá corre H2)
spring.flyway.enabled=false

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# JWT (clave fija de desarrollo, no sensible, solo para entorno local)
jwt.secret=dev-only-secret-key-no-usar-en-produccion-necesita-64-caracteres-minimo-xxxxxxxx
jwt.expiration=86400000

# ========================================
# MERCADO PAGO (credenciales de TEST)
# ========================================

# También van por variable de entorno: Mercado Pago exige credenciales de prueba
# reales, no hay un valor fijo válido para desarrollo. Se generan gratis en
# https://www.mercadopago.com.ar/developers/panel/app (cuenta de test).
# Sin ellas el backend no arranca (ver MercadoPagoConfiguration): es deliberado,
# nadie debería levantar el stack completo sin poder ejercitar el flujo de pago.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# BACKEND_URL tiene que ser una URL pública (ej. la de un túnel ngrok) para que
# Mercado Pago pueda alcanzar el webhook desde afuera; localhost no le sirve.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8081}

# Minutos que un pedido puede quedar PENDIENTE (con su stock reservado) antes de
# que el job de expiración lo cancele y devuelva el stock.
pedidos.expiracion-minutos=30

# ========================================
# EMAIL (SMTP) — completar con credenciales de test de Brevo/Resend para probar el envío real
# ========================================

# Defaults vacíos: a diferencia del JWT secret, levantar el backend sin SMTP
# configurado no debe romper el arranque, solo falla si de verdad se intenta
# mandar un mail (EmailService.enviarSeguro ya atrapa ese error).
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@localhost}
