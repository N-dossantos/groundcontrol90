services:
  # ========================================
  # BASE DE DATOS MYSQL
  # ========================================
  mysql-db:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en el .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Falta MYSQL_DATABASE en el .env}
      MYSQL_USER: ${MYSQL_USER:?Falta MYSQL_USER en el .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en el .env}
    # Sin ports: la base sólo es accesible dentro de ecommerce-network, que es todo lo
    # que el backend necesita (le llega por el hostname mysql-db). Publicar el puerto la
    # expondría a Internet — y ufw no lo impediría, porque Docker escribe sus reglas en
    # DOCKER-USER y en la tabla nat, que se evalúan antes que las de ufw. Para conectar
    # un cliente de SQL: túnel SSH, no republicar el puerto (ver README, Deploy).
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # BACKEND - SPRING BOOT (DESDE GITHUB CONTAINER REGISTRY)
  # ========================================
  backend:
    # Imagen publicada automáticamente por CI al mergear a main
    image: "${BACKEND_IMAGE:?Falta BACKEND_IMAGE en el .env, por ejemplo ghcr.io/tu-org/ecommerce-backend:latest}"
    container_name: ecommerce-backend
    restart: unless-stopped
    # Sin ports: solo accesible dentro de ecommerce-network, detrás del proxy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:?Falta MYSQL_DATABASE en el .env}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?Falta SPRING_DATASOURCE_USERNAME en el .env}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Falta SPRING_DATASOURCE_PASSWORD en el .env}
      - JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET en el .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Falta CORS_ALLOWED_ORIGINS en el .env}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:?Falta MERCADOPAGO_ACCESS_TOKEN en el .env}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:?Falta MERCADOPAGO_PUBLIC_KEY en el .env}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:?Falta MERCADOPAGO_WEBHOOK_SECRET en el .env}
      - FRONTEND_URL=${FRONTEND_URL:?Falta FRONTEND_URL en el .env}
      - BACKEND_URL=${BACKEND_URL:?Falta BACKEND_URL en el .env}
      # SMTP: application-prod.properties las exige sin default, así que sin estas
      # variables el backend ni siquiera arranca.
      - SMTP_HOST=${SMTP_HOST:?Falta SMTP_HOST en el .env}
      - SMTP_PORT=${SMTP_PORT:?Falta SMTP_PORT en el .env}
      - SMTP_USERNAME=${SMTP_USERNAME:?Falta SMTP_USERNAME en el .env}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?Falta SMTP_PASSWORD en el .env}
      - MAIL_FROM=${MAIL_FROM:?Falta MAIL_FROM en el .env}
      - SERVER_PORT=8081
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/categorias || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Pull policy: siempre descargar la última versión
    pull_policy: always

  # ========================================
  # FRONTEND - REACT + VITE (DESDE GITHUB CONTAINER REGISTRY)
  # ========================================
  frontend:
    # Imagen publicada automáticamente por CI al mergear a main
    image: "${FRONTEND_IMAGE:?Falta FRONTEND_IMAGE en el .env, por ejemplo ghcr.io/tu-org/ecommerce-frontend:latest}"
    container_name: ecommerce-frontend
    restart: unless-stopped
    # Sin ports: solo accesible dentro de ecommerce-network, detrás del proxy
    depends_on:
      - backend
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Pull policy: siempre descargar la última versión
    pull_policy: always

  # ========================================
  # REVERSE PROXY - CADDY (TLS AUTOMÁTICO)
  # ========================================
  proxy:
    image: caddy:2-alpine
    container_name: ecommerce-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Falta DOMAIN en el .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - ecommerce-network

# ========================================
# REDES
# ========================================
networks:
  ecommerce-network:
    driver: bridge

# ========================================
# VOLÚMENES (PERSISTENCIA DE DATOS)
# ========================================
volumes:
  mysql_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

