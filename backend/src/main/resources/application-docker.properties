# ========================================
# CONFIGURACIÓN PARA EL STACK DE DESARROLLO CON DOCKER
# ========================================
#
# Este perfil lo activa docker-compose.yml, el "Método 1: Docker" del README — el
# primer camino que prueba alguien que clona el repo. Antes el compose pedía
# SPRING_PROFILES_ACTIVE=docker y este archivo no existía: sin él no se definían
# jwt.secret ni cors.allowed-origins, JwtUtil.init() tiraba IllegalStateException y
# el backend no arrancaba.
#
# Es un entorno de desarrollo, no de producción: usa MySQL como prod (a diferencia
# del perfil dev, que corre sobre H2 en memoria) pero con secretos fijos y datos de
# ejemplo. Para el VPS está el perfil prod, que exige todo por variable de entorno.

server.port=8081

# Logging detallado, igual que en dev
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=DEBUG

# ========================================
# MYSQL (el contenedor mysql-db del compose)
# ========================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mismo mecanismo que producción: el esquema lo versiona Flyway e Hibernate valida.
# Así el stack de Docker ejercita las migraciones reales en vez de dejar que
# Hibernate genere un esquema que después no coincide con el del VPS.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# SECRETOS DE DESARROLLO
# ========================================

# Clave fija de desarrollo, no sensible. En producción JWT_SECRET es obligatoria y sin
# default: ver application-prod.properties.
jwt.secret=${JWT_SECRET:docker-only-secret-key-no-usar-en-produccion-necesita-64-caracteres-xxxx}
jwt.expiration=${JWT_EXPIRATION:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173}

# ========================================
# MERCADO PAGO (credenciales de TEST)
# ========================================

# Igual que en dev: Mercado Pago exige credenciales de prueba reales, no hay un valor
# fijo válido. Sin ellas el backend no arranca (ver MercadoPagoConfiguration).
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# BACKEND_URL tiene que ser una URL pública (ej. un túnel ngrok) para que Mercado Pago
# pueda alcanzar el webhook desde afuera; localhost no le sirve.
app.frontend-url=${FRONTEND_URL:http://localhost}
app.backend-url=${BACKEND_URL:http://localhost:8081}

pedidos.expiracion-minutos=30

# ========================================
# EMAIL (SMTP)
# ========================================

# Defaults vacíos: levantar el stack sin SMTP no debe romper el arranque, sólo falla
# si de verdad se intenta mandar un mail (EmailService.enviarSeguro lo atrapa).
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@localhost}
