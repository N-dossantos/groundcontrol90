# ========================================
# CONFIGURACIÓN PARA PRODUCCIÓN (MySQL)
# ========================================

# Configuración del servidor
server.port=8081

# En prod el backend corre siempre detrás del reverse proxy (Caddy), que reescribe
# X-Forwarded-For con la IP real del cliente. Sin esto, request.getRemoteAddr()
# devuelve la IP del proxy y el rate limiting de /api/auth/* usaría un único bucket
# compartido por todos los usuarios.
server.forward-headers-strategy=framework

# ========================================
# CONFIGURACIÓN DE MYSQL
# ========================================

# Datasource (conexión a MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# CONFIGURACIÓN DE HIBERNATE/JPA
# ========================================

# DDL (Estructura de tablas): el esquema lo versiona Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Mostrar SQL en consola (útil en desarrollo)
spring.jpa.show-sql=true

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# CORS (obligatorio por variable de entorno, sin default)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT (obligatorio por variable de entorno, sin default)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================
# MERCADO PAGO
# ========================================

# Credenciales de la aplicación de Mercado Pago (obligatorias, sin default).
# El access token y el webhook secret nunca salen del backend.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET}

# URLs públicas: el frontend recibe al comprador de vuelta desde el checkout y
# Mercado Pago le pega al webhook del backend, así que ninguna puede ser localhost.
app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}

# Minutos que un pedido puede quedar PENDIENTE (con su stock reservado) antes de
# que el job de expiración lo cancele y devuelva el stock.
pedidos.expiracion-minutos=30
