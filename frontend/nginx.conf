server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defensa en profundidad: en producción estos headers los pone Caddy, que es por
    # donde entra todo el tráfico. Se repiten acá para que el contenedor del frontend
    # tampoco los sirva sin ellos si algún día se expone directo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
