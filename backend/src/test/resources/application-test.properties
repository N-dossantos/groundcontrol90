spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway solo se usa en prod (las migraciones son DDL de MySQL, acá corre H2)
spring.flyway.enabled=false

jwt.secret=test-secret-key-para-hs512-con-longitud-suficiente-de-al-menos-64-caracteres-xxxxxxxxxxxx
jwt.expiration=3600000

cors.allowed-origins=http://localhost:5173

# Credenciales dummy: MercadoPagoConfiguration exige que no estén en blanco, pero
# ningún test le pega a la API real de Mercado Pago (el cliente va mockeado).
mercadopago.access-token=TEST-dummy-access-token-para-tests
mercadopago.public-key=TEST-dummy-public-key-para-tests
mercadopago.webhook-secret=dummy-webhook-secret-para-tests

app.frontend-url=http://localhost:5173
app.backend-url=http://localhost:8081

spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=no-reply@test.com

# Los tests de upload escriben en un directorio temporal, no en el repo
app.uploads.dir=${java.io.tmpdir}/ecommerce-uploads-test
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
