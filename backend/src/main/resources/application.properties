# ========================================
# CONFIGURACIÓN PRINCIPAL DE LA APLICACIÓN
# ========================================

# Perfil por defecto: desarrollo. Producción activa `prod` explícitamente con
# SPRING_PROFILES_ACTIVE en docker-compose.prod.yml, y ese perfil exige variables
# de entorno (JWT_SECRET, credenciales de MySQL y de Mercado Pago) que no existen
# en una máquina local: dejar `prod` como default sólo hacía fallar el arranque.
spring.profiles.active=dev

# Logging: INFO es el nivel base porque este archivo aplica también al perfil prod.
# El detalle DEBUG (queries, cadena de autenticación) vive en application-dev.properties;
# en producción volcaría el SQL y el interior de Spring Security a los logs.
logging.level.com.ecommerce=INFO
logging.level.org.springframework.security=INFO

# ========================================
# SUBIDA DE IMÁGENES DE PRODUCTO
# ========================================

# Dónde se guardan los archivos que suben los vendedores. En producción es un volumen
# de Docker montado en /app/uploads: sin volumen, cada `docker compose pull` se llevaría
# puestas todas las imágenes del catálogo junto con el contenedor viejo.
app.uploads.dir=${UPLOADS_DIR:./uploads}

# El corte por tamaño va acá además de en AlmacenamientoService: éste rechaza la request
# antes de bufferear el archivo entero, el del service es la validación de negocio.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
